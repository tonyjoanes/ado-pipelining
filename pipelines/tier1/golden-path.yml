# ============================================================
# TIER 1 — GOLDEN PATH PIPELINE
# ============================================================
# Copy this file to your repository as azure-pipelines.yml.
# Change appName and dotnetVersion. That's it.
#
# Which environments are deployed, in which order, and via
# which service connections is a platform concern defined in
# templates/stages/deploy-all-environments.yml — one place,
# inherited by every Tier 1 pipeline automatically.
#
# Need a non-standard environment list, extra steps, or custom
# service connections? That's Tier 2 or Tier 3 territory.
# ============================================================

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '**/*.md'

parameters:
  - name: appName
    displayName: Application name (kebab-case, e.g. my-api)
    type: string
    default: 'my-api'

  - name: dotnetVersion
    displayName: .NET SDK version
    type: string
    default: '8.0.x'

  - name: runIntegrationTests
    displayName: Run integration tests in build stage
    type: boolean
    default: false

variables:
  - name: appName
    value: ${{ parameters.appName }}
  - name: buildConfiguration
    value: Release
  - name: artifactName
    value: drop

stages:

  # ── Build, test, and security scan ────────────────────────────────────────
  - template: ../../templates/stages/build-stage.yml
    parameters:
      appName: ${{ parameters.appName }}
      dotnetVersion: ${{ parameters.dotnetVersion }}
      buildConfiguration: $(buildConfiguration)
      artifactName: $(artifactName)
      runSecurityScan: true

  # ── Promote through all environments ──────────────────────────────────────
  # Environment list, service connections, and promotion chain are all in the
  # template. Teams inherit any platform changes without touching their pipeline.
  - template: ../../templates/stages/deploy-all-environments.yml
    parameters:
      appName: ${{ parameters.appName }}
      artifactName: $(artifactName)

# ============================================================
# TIER 2 — EXTENDED PIPELINE
# ============================================================
# Use this when your service needs steps beyond the golden path:
# database migrations, custom build jobs, OpenAPI client generation,
# or extended smoke test paths.
#
# This example shows:
#   1. A custom pre-build job (OpenAPI client generation)
#   2. A custom AppDeploy stage for dev that includes EF Core migrations
#   3. Standard deploy-all-environments for all other environments
#
# Tier 2 pattern for overriding a specific env's deployment:
#   - Use deploy-all-environments for environments you don't customise
#   - Write explicit stages only for the environments you need to change
#   - Keep AppDeploy_{env} / InfraDeploy_{env} / SmokeTest_{env} naming
#     so dependsOn references work correctly
# ============================================================

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '**/*.md'

parameters:
  - name: appName
    type: string
    default: 'payment-api'

  - name: dotnetVersion
    type: string
    default: '8.0.x'

  - name: runIntegrationTests
    type: boolean
    default: true

variables:
  - name: appName
    value: ${{ parameters.appName }}
  - name: buildConfiguration
    value: Release
  - name: artifactName
    value: drop

stages:

  # ── Build — with custom pre-build code generation job ─────────────────────
  - stage: Build
    displayName: 'Build ${{ parameters.appName }}'
    jobs:
      # Custom: generate typed API clients before the main build
      - job: GenerateApiClients
        displayName: 'Generate OpenAPI clients'
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: UseDotNet@2
            inputs:
              version: ${{ parameters.dotnetVersion }}
          - script: |
              dotnet tool install --global Microsoft.dotnet-openapi 2>/dev/null || true
              echo "Generating typed clients from upstream API contracts..."
            displayName: 'Generate API clients'

      # Standard build job — depends on code gen finishing first
      - template: ../../templates/jobs/build-dotnet.yml
        parameters:
          appName: ${{ parameters.appName }}
          dotnetVersion: ${{ parameters.dotnetVersion }}
          buildConfiguration: $(buildConfiguration)
          artifactName: $(artifactName)
          dependsOn: [GenerateApiClients]

      - template: ../../templates/jobs/security-scan.yml
        parameters:
          appName: ${{ parameters.appName }}
          dotnetVersion: ${{ parameters.dotnetVersion }}

  # ── Dev: infrastructure via template, app deploy customised ───────────────
  - template: ../../templates/stages/infra-deploy-stage.yml
    parameters:
      environment: dev
      appName: ${{ parameters.appName }}
      azureSubscription: sc-nonprod
      dependsOn: [Build]

  # Override AppDeploy_dev to add EF Core migrations after the standard deploy
  - stage: AppDeploy_dev
    displayName: 'Deploy Application [DEV] + Migrations'
    dependsOn: [InfraDeploy_dev]
    variables:
      - template: ../../templates/variables/dev.yml
    jobs:
      - template: ../../templates/jobs/deploy-app-service.yml
        parameters:
          environment: dev
          appName: ${{ parameters.appName }}
          azureSubscription: sc-nonprod
          artifactName: $(artifactName)

      # Tier 2 custom: run EF Core migrations after the app is deployed
      - job: RunMigrations_dev
        displayName: 'Run EF Core migrations'
        dependsOn: [DeployApp_dev]
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: UseDotNet@2
            inputs:
              version: ${{ parameters.dotnetVersion }}
          - task: AzureCLI@2
            displayName: 'Apply EF Core migrations'
            inputs:
              azureSubscription: sc-nonprod
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                CONNECTION_STRING=$(az keyvault secret show \
                  --vault-name "kv-$(appName)-dev" \
                  --name sqlConnectionString \
                  --query value -o tsv)
                dotnet ef database update \
                  --project src/${{ parameters.appName }}/${{ parameters.appName }}.csproj \
                  --connection "$CONNECTION_STRING"

  - template: ../../templates/stages/smoke-test-stage.yml
    parameters:
      environment: dev
      appName: ${{ parameters.appName }}
      dependsOn: [AppDeploy_dev]
      additionalPaths:
        - /api/health/ready
        - /api/version

  # ── Test through Live: standard platform behaviour ─────────────────────────
  # We only customised dev. All other environments use the combined template.
  # Service connections, ordering, and approval gates are platform-managed.
  - template: ../../templates/stages/deploy-all-environments.yml
    parameters:
      appName: ${{ parameters.appName }}
      artifactName: $(artifactName)
      environments:
        - name: test
          azureSubscription: sc-nonprod
          previousEnv: dev       # waits for dev's SmokeTest_dev
        - name: uat
          azureSubscription: sc-nonprod
          previousEnv: test
        - name: staging
          azureSubscription: sc-prod
          previousEnv: uat
        - name: live
          azureSubscription: sc-prod
          previousEnv: staging

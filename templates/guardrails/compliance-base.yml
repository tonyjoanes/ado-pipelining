# ============================================================
# COMPLIANCE BASE TEMPLATE  (Tier 3 `extends` target)
# ============================================================
# Evaluated at pipeline compile time by ADO. Mandatory stages
# cannot be removed by teams extending this template.
#
# Teams inject custom work through typed insertion points only:
#   preDeployStages  — after Build, before environment deploys
#   postDeployStages — after ComplianceValidation
#
# To add/change environments for the whole platform, update
# deploy-all-environments.yml (Tier 1/2) AND the environments
# default here (Tier 3). Both are platform-owned files.
#
# ADO Project Setting required:
#   Settings → Pipelines → Required template →
#     path: templates/guardrails/compliance-base.yml
#     branch: main
# ============================================================

parameters:
  - name: appName
    type: string

  - name: dotnetVersion
    type: string
    default: '8.0.x'

  - name: bicepEnvironmentPath
    type: string
    default: infra/environments

  # Teams may override to add a canary or skip an environment.
  # Any change is visible in their pipeline file and subject to PR review.
  # Must match templates/stages/deploy-all-environments.yml defaults
  # when using the standard platform environment set.
  - name: environments
    type: object
    default:
      - name: dev
        azureSubscription: sc-nonprod
        previousEnv: ''
      - name: test
        azureSubscription: sc-nonprod
        previousEnv: dev
      - name: uat
        azureSubscription: sc-nonprod
        previousEnv: test
      - name: staging
        azureSubscription: sc-prod
        previousEnv: uat
      - name: live
        azureSubscription: sc-prod
        previousEnv: staging

  # Must be the name of the last entry in environments.
  # ComplianceValidation depends on SmokeTest_{lastEnvironment}.
  # Update this if you override environments with a different last env.
  - name: lastEnvironment
    type: string
    default: live

  # Typed insertion points — teams inject stages here, nowhere else
  - name: preDeployStages
    type: stageList
    default: []

  - name: postDeployStages
    type: stageList
    default: []

stages:

  # ── MANDATORY: Build with security scan (cannot be skipped) ───────────────
  - template: ../stages/build-stage.yml
    parameters:
      appName: ${{ parameters.appName }}
      dotnetVersion: ${{ parameters.dotnetVersion }}
      buildConfiguration: Release
      artifactName: drop
      runSecurityScan: true

  # ── OPTIONAL: Team-injected stages before environment deployments ──────────
  - ${{ each stage in parameters.preDeployStages }}:
    - ${{ stage }}

  # ── MANDATORY: All environments in sequence ────────────────────────────────
  - template: ../stages/deploy-all-environments.yml
    parameters:
      appName: ${{ parameters.appName }}
      artifactName: drop
      bicepEnvironmentPath: ${{ parameters.bicepEnvironmentPath }}
      environments: ${{ parameters.environments }}

  # ── MANDATORY: OPA compliance validation (cannot be skipped) ──────────────
  - stage: ComplianceValidation
    displayName: 'Compliance Validation (OPA)'
    dependsOn:
      - SmokeTest_${{ parameters.lastEnvironment }}
    jobs:
      - job: OpaValidation
        displayName: 'OPA policy checks'
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: ../steps/opa-policy-check.yml
            parameters:
              policyDir: templates/guardrails/policies
              bicepFile: ${{ parameters.bicepEnvironmentPath }}/${{ parameters.lastEnvironment }}/main.bicep
              environment: ${{ parameters.lastEnvironment }}

  # ── OPTIONAL: Team-injected stages after compliance validation ────────────
  - ${{ each stage in parameters.postDeployStages }}:
    - ${{ stage }}

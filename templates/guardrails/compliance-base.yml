# ============================================================
# COMPLIANCE BASE TEMPLATE  (Tier 3 `extends` target)
# ============================================================
# This template is evaluated at pipeline compile time by ADO.
# Mandatory stages CANNOT be removed by teams extending this template.
# Teams inject custom work ONLY through the typed insertion points below.
#
# ADO Project Setting required:
#   Settings → Pipelines → Required template →
#     path: templates/guardrails/compliance-base.yml
#     branch: main
#
# This ensures no team can point at a modified fork of this file.
# ============================================================

parameters:
  - name: appName
    type: string

  - name: azureSubscription
    type: string
    default: sc-nonprod

  - name: dotnetVersion
    type: string
    default: '8.0.x'

  # Typed insertion point: stages that run after Build, before environment deploys
  # These may depend on Build or on AppDeploy_{env} stages
  - name: preDeployStages
    type: stageList
    default: []

  # Typed insertion point: stages that run after all environment smoke tests
  - name: postDeployStages
    type: stageList
    default: []

  # Teams may supply a custom Bicep path but it MUST remain under infra/environments
  # (enforced at runtime by require-approved-modules.rego)
  - name: bicepEnvironmentPath
    type: string
    default: infra/environments

stages:

  # ── MANDATORY: Build with security scan (cannot be skipped) ───────────────
  - template: ../stages/build-stage.yml
    parameters:
      appName: ${{ parameters.appName }}
      dotnetVersion: ${{ parameters.dotnetVersion }}
      buildConfiguration: Release
      artifactName: drop
      runSecurityScan: true

  # ── OPTIONAL: Team-injected pre-deploy stages ─────────────────────────────
  - ${{ each stage in parameters.preDeployStages }}:
    - ${{ stage }}

  # ── MANDATORY: Dev and Test (no approval required) ────────────────────────
  - template: ../stages/infra-deploy-stage.yml
    parameters:
      environment: dev
      appName: ${{ parameters.appName }}
      azureSubscription: ${{ parameters.azureSubscription }}
      bicepEnvironmentPath: ${{ parameters.bicepEnvironmentPath }}
      dependsOn: [Build]

  - template: ../stages/app-deploy-stage.yml
    parameters:
      environment: dev
      appName: ${{ parameters.appName }}
      azureSubscription: ${{ parameters.azureSubscription }}
      artifactName: drop
      dependsOn: [InfraDeploy_dev]

  - template: ../stages/smoke-test-stage.yml
    parameters:
      environment: dev
      appName: ${{ parameters.appName }}
      dependsOn: [AppDeploy_dev]

  - template: ../stages/infra-deploy-stage.yml
    parameters:
      environment: test
      appName: ${{ parameters.appName }}
      azureSubscription: ${{ parameters.azureSubscription }}
      bicepEnvironmentPath: ${{ parameters.bicepEnvironmentPath }}
      dependsOn: [SmokeTest_dev]

  - template: ../stages/app-deploy-stage.yml
    parameters:
      environment: test
      appName: ${{ parameters.appName }}
      azureSubscription: ${{ parameters.azureSubscription }}
      artifactName: drop
      dependsOn: [InfraDeploy_test]

  - template: ../stages/smoke-test-stage.yml
    parameters:
      environment: test
      appName: ${{ parameters.appName }}
      dependsOn: [AppDeploy_test]

  # ── MANDATORY: UAT, Staging, Live (approval gate on ADO Environment) ──────
  - template: ../stages/infra-deploy-stage.yml
    parameters:
      environment: uat
      appName: ${{ parameters.appName }}
      azureSubscription: ${{ parameters.azureSubscription }}
      bicepEnvironmentPath: ${{ parameters.bicepEnvironmentPath }}
      dependsOn: [SmokeTest_test]

  - template: ../stages/app-deploy-stage.yml
    parameters:
      environment: uat
      appName: ${{ parameters.appName }}
      azureSubscription: ${{ parameters.azureSubscription }}
      artifactName: drop
      dependsOn: [InfraDeploy_uat]

  - template: ../stages/smoke-test-stage.yml
    parameters:
      environment: uat
      appName: ${{ parameters.appName }}
      dependsOn: [AppDeploy_uat]

  - template: ../stages/infra-deploy-stage.yml
    parameters:
      environment: staging
      appName: ${{ parameters.appName }}
      azureSubscription: ${{ parameters.azureSubscription }}
      bicepEnvironmentPath: ${{ parameters.bicepEnvironmentPath }}
      dependsOn: [SmokeTest_uat]

  - template: ../stages/app-deploy-stage.yml
    parameters:
      environment: staging
      appName: ${{ parameters.appName }}
      azureSubscription: ${{ parameters.azureSubscription }}
      artifactName: drop
      dependsOn: [InfraDeploy_staging]

  - template: ../stages/smoke-test-stage.yml
    parameters:
      environment: staging
      appName: ${{ parameters.appName }}
      dependsOn: [AppDeploy_staging]

  - template: ../stages/infra-deploy-stage.yml
    parameters:
      environment: live
      appName: ${{ parameters.appName }}
      azureSubscription: sc-prod
      bicepEnvironmentPath: ${{ parameters.bicepEnvironmentPath }}
      dependsOn: [SmokeTest_staging]

  - template: ../stages/app-deploy-stage.yml
    parameters:
      environment: live
      appName: ${{ parameters.appName }}
      azureSubscription: sc-prod
      artifactName: drop
      dependsOn: [InfraDeploy_live]

  - template: ../stages/smoke-test-stage.yml
    parameters:
      environment: live
      appName: ${{ parameters.appName }}
      dependsOn: [AppDeploy_live]

  # ── MANDATORY: OPA compliance validation (must pass before pipeline ends) ──
  - stage: ComplianceValidation
    displayName: 'Compliance Validation (OPA)'
    dependsOn: [SmokeTest_live]
    jobs:
      - job: OpaValidation
        displayName: 'OPA policy checks'
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: ../steps/opa-policy-check.yml
            parameters:
              azureSubscription: ${{ parameters.azureSubscription }}
              policyDir: templates/guardrails/policies
              bicepFile: ${{ parameters.bicepEnvironmentPath }}/live/main.bicep

  # ── OPTIONAL: Team-injected post-deploy stages ────────────────────────────
  - ${{ each stage in parameters.postDeployStages }}:
    - ${{ stage }}

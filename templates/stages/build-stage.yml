# Build Stage
# Compiles the .NET solution, runs tests, publishes the artifact,
# and runs two independent scans in parallel:
#   - security-scan: NuGet vulnerability audit + SAST (code/secrets)
#   - psrule-scan:   Well-Architected infrastructure scan (Bicep templates)
#
# The two scans are separate jobs so they run concurrently and a failure
# in one doesn't suppress output from the other.
# All tiers use this stage.

parameters:
  - name: appName
    type: string
  - name: dotnetVersion
    type: string
    default: '8.0.x'
  - name: buildConfiguration
    type: string
    default: Release
  - name: artifactName
    type: string
    default: drop
  - name: runSecurityScan
    type: boolean
    default: false
  - name: runPSRuleScan
    type: boolean
    default: true
  - name: psruleInputPath
    type: string
    default: infra/

stages:
  - stage: Build
    displayName: 'Build ${{ parameters.appName }}'
    jobs:
      - template: ../jobs/build-dotnet.yml
        parameters:
          appName: ${{ parameters.appName }}
          dotnetVersion: ${{ parameters.dotnetVersion }}
          buildConfiguration: ${{ parameters.buildConfiguration }}
          artifactName: ${{ parameters.artifactName }}

      - ${{ if eq(parameters.runSecurityScan, true) }}:
        - template: ../jobs/security-scan.yml
          parameters:
            appName: ${{ parameters.appName }}
            dotnetVersion: ${{ parameters.dotnetVersion }}

      # PSRule scans Bicep templates against Microsoft's Well-Architected rules.
      # Runs in parallel with the dotnet build — no dependency between them.
      # failOnUnmatchedRules defaults to false so initial adoption is non-blocking;
      # set to true once the team has resolved the baseline findings.
      - ${{ if eq(parameters.runPSRuleScan, true) }}:
        - template: ../jobs/psrule-scan.yml
          parameters:
            inputPath: ${{ parameters.psruleInputPath }}
            failOnUnmatchedRules: false
